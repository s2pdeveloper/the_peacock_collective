<div class="container-fluid collection" id="newArrivals">
  <div class="row py-4" *ngFor="let item of selectedCategories">
    <div class="col-12 d-flex justify-content-center">
      <p class="section-heading">{{ item?.name }}</p>
    </div>
    <div class="col-12 product large-list pb-4">
      <div class="row product-row">
        <div class="col-12 product-column">
          <div class="card border-0">
            <swiper-container class="img-box" slides-per-view="5" [navigation]="true">
              <ng-container
                *ngFor="
                  let p of commonService.allData.products
                    | homeProduct : item
                "
              >
                <swiper-slide
                  class="p-2 prod-cart bg-light border m-2"
                  (click)="navigateTo(p?.id)"
                >
                  <img class="img-fluid w-100" [src]="p?.bannerImage" />
                  <div class="text-box p-2">
                    <div class="d-flex justify-content-center">
                      <p class="cat-name">{{ p?.name }}</p>
                      <!-- <p class="fw-bold prod-price">
                      {{ product?.price | currency : 'CAD' : "INR" }}
                    </p> -->
                    </div>
                  </div>
                  <!-- <p class="prod-name text-center">{{ p?.hsn }}</p>
                <p class="prod-name text-center">{{ p.name }}</p> -->
                </swiper-slide>
              </ng-container>
            </swiper-container>
          </div>
        </div>
      </div>
    </div>
    <div class="col-12 product medium-list">
      <div class="row product-row">
        <div class="col-12 product-column">
          <div class="card border-0">
            <swiper-container class="img-box" slides-per-view="2" [navigation]="true">
              <ng-container
                *ngFor="
                  let p of commonService.allData.products
                    | homeProduct : item
                "
              >
                <swiper-slide
                  class="p-2 prod-cart border"
                  (click)="navigateTo(p?.id)"
                >
                  <img class="img-fluid w-100" [src]="p?.bannerImage" />
                  <div class="text-box p-2">
                    <div class="d-flex justify-content-center">
                      <p class="cat-name">{{ p?.name }}</p>
                      <!-- <p class="fw-bold prod-price">
                      {{ product?.price | currency : 'CAD' : "INR" }}
                    </p> -->
                    </div>
                  </div>
                  <!-- <p class="prod-name text-center">{{ p?.hsn }}</p> -->
                </swiper-slide>
              </ng-container>
            </swiper-container>
          </div>
        </div>
      </div>
    </div>
    <div class="col-12 product small-list">
      <div class="row product-row">
        <div class="col-12 product-column">
          <div class="card border-0">
            <swiper-container class="img-box" slides-per-view="2" [navigation]="true">
              <ng-container
                *ngFor="
                  let p of commonService.allData.products
                    | homeProduct : item
                "
              >
                <swiper-slide
                  class="p-2 prod-cart border"
                  (click)="navigateTo(p?.id)"
                >
                  <img class="img-fluid w-100" [src]="p?.bannerImage" />
                  <div class="text-box p-2">
                    <div class="d-flex justify-content-center">
                      <p class="cat-name">{{ p?.name }}</p>
                      <!-- <p class="fw-bold prod-price">
                      {{ product?.price | currency : 'CAD' : "INR" }}
                    </p> -->
                    </div>
                  </div>
                  <!-- <p class="prod-name text-center">{{ p?.hsn }}</p> -->
                </swiper-slide>
              </ng-container>
            </swiper-container>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
