<div class="container-fluid">
  <div class="row">
    <div class="col-12 img-wrapper">
      <img
        class="img-fluid w-100"
        src="../../../../assets/products/sari/front.jpeg"
        alt=""
      />
      <div class="text-part">
        <p class="cat-name">
          {{ category?.categoryWithtags[0]?.CategoryTagMapWithTag?.title }}
        </p>
        <p class="page-name">{{ category?.name }}</p>
      </div>
    </div>
    <div class="col-12 desc-container">
      <div class="row justify-content-center" *ngIf="category?.description">
        <div class="col-12 col-md-9 col-lg-6">
          <p class="description text-center">
            <q>{{ category?.description }}</q>
          </p>
        </div>
      </div>
    </div>

    <div class="col-12 px-2 pointer">
      <div class="row row-cols row-cols-lg-5 row-cols-md-2 justify-content-center p-2">
        <div
          class="col prod-cart bg-light border m-2 p-2"
          *ngFor="let p of products; trackBy: trackByFunc"
          (click)="navigateToProdDetails(p?.id)"
        >
          <img class="prod-img w-100" [src]="p?.bannerImage" />
          <div class="text-box px-3 py-1">
            <p class="prod-name">{{ p?.name | uppercase }}</p>
          </div>
        </div>
      </div>
    </div>
