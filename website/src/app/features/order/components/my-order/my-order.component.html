<div class="container-fluid">
  <div class="row justify-content-center">
    <div class="col-11">
      <div class="row">
        <div class="col-12">
          <div class="row w-100 justify-content-between">
            <div class="col-12 col-lg-11">
              <p class="py-3 text-color-primary pointer">
                <span (click)="navigateTo('/')">Home</span> /
                <span>My Orders</span>
              </p>
            </div>
          </div>
          <div *ngIf="orders.length" class="row mt-5 w-100 justify-content-between">
            <div class="col-12">
              <!-- <div class="row border-bottom pb-2">
                <div class="col-5">Products</div>
                <div class="col-3 text-center">Quantity</div>
                <div class="col-2 text-center">Price</div>
                <div class="col-2 text-center">Total</div>
              </div> -->

              <div class="row bg-white mb-3 rounded-3 p-2 item-row pointer" *ngFor="let order of orders; let i = index">
                <div class="col-3 text-center d-block d-md-flex d-lg-flex my-auto">
                  <!-- <img width="100" height="90" [src]="
                      order?.orderVariantMapWithVariant?.variantImages[0].image
                    " (click)="
                      navigateToProdDetails(
                        order?.orderVariantMapWithVariant?.productId
                      )
                    " alt="" /> -->
                  <div class="p-3 ">
                    <p class="light-dark regular-font">
                      #{{order?.orderNumber}}
                    </p>
                    <p class="text-muted regular-text attr" *ngFor="
                        let item of order?.orderVariantMapWithVariant?.variantWithAttrVariantMap
                      ">
                      {{ item?.AttrVariantMapWithAttributes?.name }}:

                      <ng-container *ngIf="item?.AttrVariantMapWithAttributes?.type == 'color'"> <i
                          class="fa-solid fa-square" [ngStyle]="{'background-color':item?.value}"></i></ng-container>
                      <ng-container *ngIf="item?.AttrVariantMapWithAttributes?.type != 'color'"> {{ item?.value
                        }}</ng-container>
                      <!-- {{ item.value }} -->
                    </p>
                  </div>
                </div>
                <div class="col-3 text-center light-dark regular-text my-auto">
                  {{ order?.status }}
                </div>
                <div class="col-2 text-center light-dark regular-text my-auto">
                  {{ order?.createdAt | date }}
                </div>
                <div class="col-2 text-center light-dark regular-text my-auto">
                  <p class="py-auto">
                    {{ order?.amount | currency : 'CAD' }}
                  </p>
                </div>
                <div class="col-2 my-auto d-flex justify-content-end">
                  <div class="p-3">
                    <div class="next-arrow" (click)="navigateTo('order/order-details/',order?.id)">
                      <i class="fa-solid fa-arrow-right"></i>
                    </div>
                  </div>
                </div>
              </div>
              <div class="row py-5">
                <div class="col-6 col-md-4 col-lg-2">
                  <button class="btn btn-dark" (click)="navigateTo('/home')">
                    Continue Shopping
                  </button>
                </div>
              </div>
            </div>
          </div>
          <div *ngIf="!orders.length" class="col-12 p-3 border-bottom">
            <h2 class="mb-4">No orders in order list!</h2>
            <div class="row">
              <div class="col-9 col-md-4 col-lg-4">
                <button class="btn btn-dark p-2" (click)="navigateTo('/home')">Continue shopping</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
